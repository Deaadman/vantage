<text x="16.0" y="191" fill="#ff4655" font-weight="bold" textLength="50.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    ✗ </text>
<text x="66.4" y="191" fill="#d8d8e0" textLength="688.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Taking fights at A Rubble. You've died there 22 times in 6 of your 6 matches here.</text>
<text x="16.0" y="227" fill="#d8d8e0" font-weight="bold" textLength="142.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  After the plant</text>
<text x="16.0" y="245" fill="#d8d8e0" textLength="907.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    You haven't played a post-plant here yet. When you do, play the spike from a spot that sees it, not from</text>
<text x="16.0" y="263" fill="#d8d8e0" textLength="142.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    on top of it.</text>
<text x="16.0" y="623" fill="#8c8c8c" textLength="613.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  ←→ or 1-3 tabs · ↑↓ scroll · Esc closes · /plan --map picks another map</text>
