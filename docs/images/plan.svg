<text x="32.8" y="83" fill="#000000" textLength="67.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Attack </text>
<text x="108.4" y="83" fill="#d8d8e0" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Defense </text>
<text x="192.4" y="83" fill="#d8d8e0" textLength="42.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Map </text>
<text x="16.0" y="119" fill="#d8d8e0" font-weight="bold" textLength="369.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  On attack: how your rounds go at each site</text>
<text x="16.0" y="137" fill="#8c8c8c" textLength="579.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    Not enough rounds on this side yet to tell one site from another.</text>
