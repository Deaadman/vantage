<text x="16.0" y="479" fill="#8c8c8c" textLength="537.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    ────────────────────────────────────────────────────────────</text>
<text x="16.0" y="515" fill="#8c8c8c" textLength="168.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    What it is      </text>
<text x="184.0" y="515" fill="#d8d8e0" textLength="705.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">You died while teammates were alive, but none was close enough to get the kill back.</text>
<text x="16.0" y="533" fill="#8c8c8c" textLength="168.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    Why it matters  </text>
<text x="184.0" y="533" fill="#d8d8e0" textLength="739.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">A death your team can't answer is a free kill for the enemy. When someone is close, even</text>
<text x="184.0" y="551" fill="#d8d8e0" textLength="327.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">losing the fight still evens the round.</text>
<text x="16.0" y="569" fill="#8c8c8c" textLength="168.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    Practise        </text>
<text x="184.0" y="569" fill="#78c878" textLength="730.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Take space a few steps from a teammate, and say which fight you're about to take before</text>
<text x="184.0" y="587" fill="#78c878" textLength="100.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">you take it.</text>
<text x="16.0" y="623" fill="#8c8c8c" textLength="873.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  ↑↓ select · Enter: make it your focus · Esc closes · better = your last 3 matches beat the ones before</text>
</svg>
