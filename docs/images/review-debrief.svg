<text x="419.2" y="83" fill="#d8d8e0" textLength="33.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> AI </text>
<text x="16.0" y="119" fill="#d8d8e0" font-weight="bold" textLength="159.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  The short version</text>
<text x="16.0" y="137" fill="#d8d8e0" textLength="898.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    A good win. The rounds slipped away in one place: peeking the same angle again after a kill. If you fix</text>
<text x="16.0" y="155" fill="#d8d8e0" textLength="294.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    one thing next match, fix that.</text>
<text x="16.0" y="191" fill="#ffc107" font-weight="bold" textLength="117.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  Issues found</text>
<text x="133.6" y="191" fill="#8c8c8c" textLength="352.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> · the three that cost you the most rounds</text>
<text x="16.0" y="209" fill="#d8d8e0" textLength="487.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    1  Peeking again right after a kill                   </text>
<text x="503.2" y="209" fill="#8c8c8c" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">lost 2 of 3</text>
<text x="16.0" y="227" fill="#d8d8e0" textLength="487.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    2  Fighting several at once in a clutch               </text>
<text x="503.2" y="227" fill="#8c8c8c" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">lost 2 of 3</text>
<text x="16.0" y="245" fill="#d8d8e0" textLength="487.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    3  First into A Rubble alone, with no ability first   </text>
<text x="503.2" y="245" fill="#8c8c8c" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">lost 2 of 2</text>
<text x="16.0" y="263" fill="#8c8c8c" textLength="378.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    To see more details, go to the Fixes tab.</text>
<text x="16.0" y="299" fill="#78c878" font-weight="bold" textLength="100.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  Keep doing</text>
<text x="16.0" y="317" fill="#78c878" font-weight="bold" textLength="50.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    + </text>
<text x="66.4" y="317" fill="#d8d8e0" textLength="243.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">You won 2 of 2 pistol rounds.</text>
<text x="16.0" y="353" fill="#ffc107" textLength="33.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  ◆ </text>
