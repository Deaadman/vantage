<svg xmlns="http://www.w3.org/2000/svg" width="972" height="644" viewBox="0 0 972 644" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14">
<rect width="972" height="644" rx="8" fill="#16161e"/>
<text x="16.0" y="29" fill="#b1b9f9" textLength="932.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">───────────────────────────────────────────────────────────────────────────────────────────────────────────────</text>
<text x="16.0" y="47" fill="#b1b9f9" font-weight="bold" textLength="84.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  Review  </text>
<text x="100.0" y="47" fill="#d8d8e0" font-weight="bold" textLength="117.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Sova on Lotus </text>
<text x="217.6" y="47" fill="#8c8c8c" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">· </text>
<text x="234.4" y="47" fill="#78c878" font-weight="bold" textLength="67.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">won 13–9</text>
<text x="301.6" y="47" fill="#8c8c8c" textLength="336.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> · 19 kills, 6 deaths · Mon 19 Oct 21:04</text>
<text x="32.8" y="83" fill="#d8d8e0" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Debrief </text>
<rect x="116.8" y="70" width="58.8" height="18" fill="#f0f0f0"/>
<text x="116.8" y="83" fill="#000000" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Fixes </text>
<text x="184.0" y="83" fill="#d8d8e0" textLength="42.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Map </text>
<text x="234.4" y="83" fill="#d8d8e0" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Clips </text>
<text x="301.6" y="83" fill="#d8d8e0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Screenshots </text>
<text x="419.2" y="83" fill="#d8d8e0" textLength="33.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> AI </text>
<text x="16.0" y="119" fill="#b1b9f9" textLength="487.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  ❯ 1  Peeking again right after a kill                   </text>
<text x="503.2" y="119" fill="#b1b9f9" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">lost 2 of 3</text>
<text x="16.0" y="137" fill="#d8d8e0" textLength="487.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    2  Fighting several at once in a clutch               </text>
<text x="503.2" y="137" fill="#8c8c8c" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">lost 2 of 3</text>
<text x="16.0" y="155" fill="#d8d8e0" textLength="487.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    3  First into A Rubble alone, with no ability first   </text>
<text x="503.2" y="155" fill="#8c8c8c" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">lost 2 of 2</text>
<text x="16.0" y="191" fill="#8c8c8c" textLength="537.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    ────────────────────────────────────────────────────────────</text>
<text x="16.0" y="227" fill="#8c8c8c" textLength="168.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    What happened   </text>
<text x="184.0" y="227" fill="#d8d8e0" textLength="739.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Rounds 14, 17 and 20. You got a kill, then died within a few steps of it: the enemy knew</text>
<text x="184.0" y="245" fill="#d8d8e0" textLength="310.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">where you were and was ready for you.</text>
<text x="16.0" y="281" fill="#8c8c8c" textLength="168.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    Why it costs    </text>
<text x="184.0" y="281" fill="#d8d8e0" textLength="730.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">After a kill the enemy knows exactly where you are, so the next peek walks into a fight</text>
<text x="184.0" y="299" fill="#d8d8e0" textLength="403.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">they're ready for. You lost 2 of those 3 rounds.</text>
<text x="16.0" y="335" fill="#8c8c8c" textLength="168.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    Try this        </text>
<text x="184.0" y="335" fill="#78c878" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">1. </text>
<text x="209.2" y="335" fill="#d8d8e0" textLength="663.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">After every kill, step back or move to a different angle before you peek again.</text>
<text x="184.0" y="353" fill="#78c878" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">2. </text>
<text x="209.2" y="353" fill="#d8d8e0" textLength="663.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">If you want that angle back, use an ability first so they have to deal with it.</text>
<text x="16.0" y="389" fill="#8c8c8c" textLength="168.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    Next match      </text>
<text x="184.0" y="389" fill="#b1b9f9" textLength="369.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">No deaths in the same spot as your own kill.</text>
<text x="16.0" y="623" fill="#8c8c8c" textLength="512.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  ←→ or 1-6 tabs · ↑↓ select · Enter: on the map · Esc closes</text>
</svg>
