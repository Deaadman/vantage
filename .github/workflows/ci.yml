# Checks every push to main and every pull request: formatting, the
# changelog's format, clippy with warnings as errors, then all the tests,
# including the full scan of the public fixtures with the pinned vrfkit, and
# a check of Cargo.lock for crates with security advisories. The release
# workflow runs this first and only publishes when it passes.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Changelog
        shell: pwsh
        run: ./scripts/release-notes.ps1 -Check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

  test:
    name: Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The vrfkit vrfkit.json names, so a pull request that changes it tests the new one.
      - name: Fetch the vrfkit in vrfkit.json
        shell: pwsh
        run: |
          $pin = Get-Content vrfkit.json -Raw | ConvertFrom-Json
          $zip = Join-Path $env:RUNNER_TEMP 'vrfkit.zip'
          Invoke-WebRequest $pin.zip_url -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne $pin.zip_sha256) { throw "vrfkit zip hash $hash doesn't match vrfkit.json" }
          $dir = Join-Path $env:RUNNER_TEMP 'vrfkit'
          Expand-Archive $zip $dir
          $exe = Get-ChildItem $dir -Recurse -Filter vrfkit.exe | Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLowerInvariant()
          if ($hash -ne $pin.exe_sha256) { throw "vrfkit.exe hash $hash doesn't match vrfkit.json" }
          "VANTAGE_VRFKIT=$($exe.FullName)" >> $env:GITHUB_ENV
          "Tested with vrfkit **$($pin.tag)** (VALORANT $($pin.builds -join ' to '))" >> $env:GITHUB_STEP_SUMMARY

      - name: Test
        run: cargo test --workspace --locked

  size:
    name: Release build size
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p vantage
      - name: Report the size
        shell: pwsh
        run: |
          $mb = (Get-Item target/release/vantage.exe).Length / 1MB
          "vantage.exe (release): **{0:N2} MB**" -f $mb >> $env:GITHUB_STEP_SUMMARY

  audit:
    name: Security advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails if a crate in Cargo.lock has a RustSec advisory.
      - name: Audit
        run: cargo audit
