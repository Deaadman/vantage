# Publishes the release install.ps1 and the updater download: push a tag like
# 1.0.0 (no v prefix; the app adds one when it shows a version) that matches
# the version in crates/cli/Cargo.toml. Every release carries
# vantage-windows-x64.exe and manifest.json (version, file, SHA-256, and the
# what's-new notes). The version's section of CHANGELOG.md is both the
# release's description and those notes; the release stops if it has none.

name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Formatting, clippy and every test, fixtures included: nothing ships unless they pass.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    # Only from a tag: a manual run from a branch checks but never publishes.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    env:
      ASSET: vantage-windows-x64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the crate version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'vantage' | Select-Object -ExpandProperty version
          if ($version -ne $env:GITHUB_REF_NAME) {
            throw "tag $env:GITHUB_REF_NAME does not match crates/cli version $version"
          }

      # The vrfkit this version has built in, and its notes, from vrfkit.json,
      # go in beside the notes. An install that already got it from a vrfkit
      # update shows nothing more for it.
      - name: Read the release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $vrfkit = Get-Content -Raw vrfkit.json | ConvertFrom-Json
          $extra = @{ vrfkit = [ordered]@{ tag = $vrfkit.tag; notes = @($vrfkit.notes) } }
          [IO.File]::WriteAllText("$PWD/whats-new-extra.json", ($extra | ConvertTo-Json -Depth 4))
          ./scripts/release-notes.ps1 -Version $env:GITHUB_REF_NAME -OutDir notes -Extra whats-new-extra.json

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p vantage

      - name: Package
        shell: pwsh
        run: |
          Copy-Item target/release/vantage.exe $env:ASSET
          $version = $env:GITHUB_REF_NAME
          $hash = (Get-FileHash -Algorithm SHA256 $env:ASSET).Hash.ToLowerInvariant()
          $whatsNew = Get-Content -Raw notes/whats-new.json | ConvertFrom-Json
          $manifest = [ordered]@{
            version = $version
            platforms = @{ 'windows-x64' = @{ file = $env:ASSET; sha256 = $hash } }
            notes = @($whatsNew.notes)
            vrfkit = [ordered]@{ tag = $whatsNew.vrfkit.tag; notes = @($whatsNew.vrfkit.notes) }
          }
          # UTF-8 without a BOM, so notes keep characters like dashes and accents.
          [IO.File]::WriteAllText("$PWD/manifest.json", ($manifest | ConvertTo-Json -Depth 4))

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # The changelog section first, then GitHub's generated notes (merged PRs and the full changelog link).
        run: gh release create $env:GITHUB_REF_NAME $env:ASSET manifest.json --title $env:GITHUB_REF_NAME --notes-file notes/release-notes.md --generate-notes --verify-tag
