# Publishes the release install.ps1 and the updater download: push a tag like
# v0.1.0 that matches the version in crates/cli/Cargo.toml. Every release
# carries vantage-windows-x64.exe and manifest.json (version, file, SHA-256).
#
# Disabled while Vantage is in development: nothing runs on push. To turn it
# on, replace the `on:` block with the commented one below.

name: Release

on:
  workflow_dispatch:
# on:
#   push:
#     tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      ASSET: vantage-windows-x64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the crate version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'vantage' | Select-Object -ExpandProperty version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "tag $env:GITHUB_REF_NAME does not match crates/cli version $version"
          }

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked -p vantage

      - name: Package
        shell: pwsh
        run: |
          Copy-Item target/release/vantage.exe $env:ASSET
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $hash = (Get-FileHash -Algorithm SHA256 $env:ASSET).Hash.ToLowerInvariant()
          $manifest = @{
            version = $version
            platforms = @{ 'windows-x64' = @{ file = $env:ASSET; sha256 = $hash } }
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Encoding ascii manifest.json

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME $env:ASSET manifest.json --title $env:GITHUB_REF_NAME --generate-notes --verify-tag
