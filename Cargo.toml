[workspace]
resolver = "3"
members = ["crates/core", "crates/cli"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
publish = false

# Abalone lives in its own repository. Until it's on GitHub, build against
# the copy beside this one; remove this once it's pushed.
[patch."https://github.com/Deaadman/abalone"]
abalone = { path = "../abalone" }
