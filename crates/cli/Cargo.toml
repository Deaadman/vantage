[package]
name = "vantage"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
serde_json = "1.0.154"
vantage-core = { version = "0.1.0", path = "../core" }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

[dev-dependencies]
gif = "0.14.2"
resvg = "0.48.1"
