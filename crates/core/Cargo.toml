[package]
name = "vantage-core"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
anyhow = "1.0.104"
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
directories = "6.0.0"
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "zstd", "snap"] }
png = "0.18.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
abalone = { git = "https://github.com/Deaadman/abalone", features = ["install", "update"] }
ureq = "3.4.2"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
